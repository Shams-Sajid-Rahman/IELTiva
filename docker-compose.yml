# Local development database. Reads POSTGRES_PASSWORD from the root .env file.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ieltiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ieltiva
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ieltiva-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ieltiva -d ieltiva"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ieltiva-postgres:
